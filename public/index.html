<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>スクリプト簡単作成AI</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">スクリプト簡単作成AI <small>バディコンサルティング｜最新版コールフロー準拠</small></div>
    <div class="topright">
      <select id="projectSelect" aria-label="案件を選択"></select>
      <span id="aiBadge" class="badge"></span>
    </div>
  </header>
  <nav class="tabs" id="tabs">
    <button data-tab="t1" class="active">① 案件・フロー</button>
    <button data-tab="t7">コールフロー図・資料</button>
    <button data-tab="t2">② 情報入力</button>
    <button data-tab="t3">③ 生成プレビュー</button>
    <button data-tab="t4">④ スクリプト修正</button>
    <button data-tab="t5">⑤ 完成版・履歴・出力</button>
    <button data-tab="t6">ナレッジ</button>
  </nav>
  <main>
    <section id="t1" class="tab active"></section>
    <section id="t2" class="tab"></section>
    <section id="t3" class="tab"></section>
    <section id="t4" class="tab"></section>
    <section id="t5" class="tab"></section>
    <section id="t6" class="tab"></section>
    <section id="t7" class="tab"></section>
  </main>
  <div id="toast" class="toast" hidden></div>
  <script src="app.js"></script>
</body>
</html>
